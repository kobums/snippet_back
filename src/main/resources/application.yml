spring:
  application:
    name: snippet

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      # HikariCP 커넥션 풀 설정 (성능 최적화)
      maximum-pool-size: 10                    # 최대 커넥션 수
      minimum-idle: 5                          # 최소 유휴 커넥션 수
      connection-timeout: 20000                # 커넥션 타임아웃 (20초)
      idle-timeout: 300000                     # 유휴 커넥션 타임아웃 (5분)
      max-lifetime: 1200000                    # 커넥션 최대 수명 (20분)
      connection-test-query: SELECT 1          # 커넥션 테스트 쿼리

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # Hibernate 배치 처리 최적화
        jdbc:
          batch_size: 20                       # 배치 크기
          fetch_size: 50                       # Fetch 크기
        order_inserts: true                    # INSERT 순서 최적화
        order_updates: true                    # UPDATE 순서 최적화
        # 2차 캐시 (선택사항 - 프로덕션에서는 Redis 등 외부 캐시 사용 권장)
        cache:
          use_second_level_cache: false        # 현재는 비활성화
          use_query_cache: false               # 현재는 비활성화
        # 통계 및 로깅
        generate_statistics: false             # 프로덕션에서는 false 권장
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false
    out-of-order: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

affiliate:
  kyobo:
    partner-id: ${KYOBO_PARTNER_ID:}
  yes24:
    partner-id: ${YES24_PARTNER_ID:}

# 로컬 개발 기본값만 두고, 프로덕션은 반드시 .env의 JWT_SECRET으로 덮어쓴다 (Base64 인코딩 필수)
jwt:
  secret: ${JWT_SECRET:defaultSecretKeyWithAtLeast256BitsForHmacSha256ForSpringSecurity1234567890}

server:
  port: 8008

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

aladin:
  api-key: ${ALADIN_API_KEY:}

data4library:
  auth-key: ${DATA4LIBRARY_AUTH_KEY:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

naver:
  clova:
    api-url: ${NAVER_CLOVA_API_URL:}
    secret-key: ${NAVER_CLOVA_SECRET_KEY:}

google:
  application:
    credentials: ${GOOGLE_APPLICATION_CREDENTIALS:}

# 앱 강제 업데이트 정책.
# min을 비워두면(기본값) 강제 업데이트가 발동하지 않는다 — 값이 다 채워졌을 때만 차단한다.
# min을 올리는 순간 그보다 낮은 버전의 사용자는 전부 앱에서 잠기므로 반드시 확인 후 설정할 것.
appversion:
  ios:
    min: ${APP_MIN_VERSION_IOS:}
    latest: ${APP_LATEST_VERSION_IOS:}
    storeurl: ${APP_STORE_URL_IOS:https://apps.apple.com/kr/app/id6759643636}
  android:
    min: ${APP_MIN_VERSION_ANDROID:}
    latest: ${APP_LATEST_VERSION_ANDROID:}
    storeurl: ${APP_STORE_URL_ANDROID:https://play.google.com/store/apps/details?id=com.gowoobro.snippet}
  message: ${APP_UPDATE_MESSAGE:}
